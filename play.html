<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Game Jam · Παίξε</title>
<meta name="theme-color" content="#22223B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Jam">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Commissioner:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gj.css?v20">
<style>
:root{--y:#FFD23F;--ink:#22223B;--paper:#FFF6D6;--red:#EE4266;--teal:#1FA88A;--indigo:#3D3A8C;
  --display:"Bungee","Arial Black",Impact,sans-serif;--body:"Commissioner","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink)}
#game{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;border:0;display:block;background:#000}

/* gate */
#gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--y);padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden}
#gate canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.gbox{position:relative;text-align:center;max-width:420px;width:100%}
.lock{display:inline-block;background:var(--ink);padding:.28em .42em .22em;border-radius:.12em;transform:rotate(-3deg);box-shadow:.12em .12em 0 var(--red);font-family:var(--display);font-size:clamp(2.4rem,13vw,3.6rem);line-height:.9;text-align:left}
.lock span{display:block;white-space:nowrap}
.lock .a{color:var(--y);text-shadow:.02em .02em 0 var(--teal),.04em .04em 0 var(--teal),.06em .06em 0 var(--teal)}
.lock .b{padding-left:.55em;text-shadow:.02em .02em 0 var(--y),.04em .04em 0 var(--y),.06em .06em 0 var(--y)}
.lock[data-l="A"] .b{color:var(--red)} .lock[data-l="B"] .b{color:var(--teal);text-shadow:.02em .02em 0 var(--y),.04em .04em 0 var(--y),.06em .06em 0 var(--y)} .lock[data-l="C"] .b{color:#8F8BFF}
.sub{margin:26px 0 0;font-weight:800;font-size:1.05rem}
.how2{margin:6px 0 0;font-weight:700;font-size:.95rem}
.how{margin:14px 0 0;font-weight:800;font-size:1.05rem;background:color-mix(in srgb,#FFF6D6 90%,transparent);border:3px solid var(--ink);border-radius:8px;padding:10px 12px}
.start{display:block;width:100%;margin-top:18px;font-family:var(--body);font-weight:900;font-size:1.3rem;padding:18px;border:3px solid var(--ink);border-radius:8px;background:var(--red);color:#fff;box-shadow:6px 6px 0 var(--ink);cursor:pointer}
.start:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.tip{margin:16px 0 0;font-size:.9rem;font-weight:700;color:#5a5670}
.tip a{color:var(--ink)}
.back{display:inline-block;margin-top:14px;font-weight:800;color:var(--ink)}
.clock{font-family:var(--display);font-size:2rem;margin-top:10px}

/* floating menu */
#fab{position:fixed;z-index:30;right:calc(10px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;touch-action:none}
#fabBtn{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);background:var(--y);color:var(--ink);font-family:var(--display);font-size:.95rem;box-shadow:3px 3px 0 var(--ink);cursor:pointer;opacity:.82}
#fab.open #fabBtn{opacity:1}
.fi{display:none;font-family:var(--body);font-weight:900;font-size:.95rem;padding:10px 14px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none}
.fi.vote{background:var(--red);color:#fff}
#fab.open .fi{display:block}
.fi[hidden]{display:none!important}
#fab[hidden]{display:none}
</style>
</head>
<body>
<iframe id="game" title="Game" allow="autoplay; fullscreen; gamepad; screen-wake-lock" allowfullscreen></iframe>

<div id="gate">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="gbox">
    <div class="lock" id="lock"><span class="a">GAME</span><span class="b" id="lockL">A</span></div>
    <div id="gateBody"></div>
  </div>
</div>

<div id="fab" hidden>
  <button id="fabBtn" type="button" aria-expanded="false" aria-label="Μενού Game Jam">GJ</button>
  <button class="fi vote" id="fiVote" type="button">★ Βαθμολόγησε</button>
  <button class="fi" id="fiCom" type="button">💬 Σχόλια</button>
  <button class="fi" id="fiFull" type="button" hidden>⛶ Πλήρης οθόνη</button>
  <a class="fi" href="index.html#games">← Πίσω στο Game Jam</a>
</div>

<script src="gj.js?v20"></script>
<script>
(function(){
  const q=new URLSearchParams(location.search); let L=(q.get("g")||"A").toUpperCase(); if(!GJ.GAMES.includes(L)) L="A";
  document.title=GJ.gname(L)+" · Game Jam";
  document.getElementById("lock").dataset.l=L; document.getElementById("lockL").textContent=L;
  const gate=document.getElementById("gate"), body=document.getElementById("gateBody"), frame=document.getElementById("game");
  const fab=document.getElementById("fab"), fabBtn=document.getElementById("fabBtn"), P=GJ.platform();
  const canFull=!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen) && !P.ios;

  function fmt(ms){ const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,"0"); return p(h)+":"+p(m)+":"+p(x); }
  async function goFull(){ try{ const el=document.documentElement; if(document.fullscreenElement) return;
      if(el.requestFullscreen) await el.requestFullscreen({navigationUI:"hide"}); else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); }catch(e){} }
  async function wake(){ try{ if("wakeLock" in navigator) await navigator.wakeLock.request("screen"); }catch(e){} }

  function renderGate(){
    const now=new Date();
    if(now<GJ.PLAY_AT){
      body.innerHTML=`<p class="sub">Το ${GJ.gname(L)} ανοίγει σε</p><div class="clock" id="clk">${fmt(GJ.PLAY_AT-now)}</div><a class="back" href="index.html">← Πίσω στο Game Jam</a>`;
      return false;
    }
    const dv=GJ.devOf(L); const who=`<p class="sub">${GJ.esc(GJ.gname(L))}${dv?` · από ${GJ.esc(dv.name)}`:""}</p>`;
    const tip = P.ios && !GJ.standalone() ? `<p class="tip">Στο iPhone για πλήρη οθόνη, <a href="index.html#installSec">βάλε το Game Jam στην αρχική οθόνη</a>.</p>` : "";
    body.innerHTML=`${who}<p class="how2">Βαθμολόγησέ το όταν τελειώσεις, από το κουμπί GJ πάνω δεξιά.</p>${(GJ.INFO[L]&&GJ.INFO[L].howto)?`<p class="how">🕹️ ${GJ.INFO[L].howto}</p>`:""}
      <button class="start" id="start" type="button">▶ Παίξε</button>${tip}<a class="back" href="index.html">← Πίσω στο Game Jam</a>${dv?` · <a class="back" href="devs/${dv.slug}/">Προφίλ δημιουργού</a>`:""}`;
    document.getElementById("start").onclick=async()=>{ if(canFull) await goFull(); wake(); gate.remove(); fab.hidden=false; try{ frame.focus(); }catch(e){} stopFx(); trackStart(); };
    if(!frame.src) frame.src="games/"+L.toLowerCase()+"/";
    return true;
  }
  if(!renderGate()){ const t=setInterval(()=>{ const c=document.getElementById("clk"); if(new Date()>=GJ.PLAY_AT){ clearInterval(t); renderGate(); } else if(c) c.textContent=fmt(GJ.PLAY_AT-new Date()); },1000); }


  /* ---------- play stats: time played + the "finish" event sent by the game ---------- */
  const TKEY="gj_time_"+L+(GJ.TEST?"_test":""); let tracking=false, secs=0, sinceReport=0;
  try{ secs=parseFloat(localStorage.getItem(TKEY))||0; }catch(e){}
  function saveT(){ try{ localStorage.setItem(TKEY,String(Math.round(secs))); }catch(e){} }
  function flushT(){ saveT(); if(secs>=1) GJ.report(L,"time",Math.round(secs)); sinceReport=0; }
  function trackStart(){
    if(tracking) return; tracking=true;
    setInterval(()=>{ if(document.visibilityState==="visible"){ secs+=5; sinceReport+=5; saveT(); if(sinceReport>=30) flushT(); } },5000);
    addEventListener("pagehide",flushT); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushT(); });
    setTimeout(flushT,21000);   // the first report only after ~20 s of real play
  }

  /* a game reports a finished run: {gj:"clear", ver, mode, seconds, details:{…}}  → champions list */
  let clearBusy=false;
  function handleClear(d){
    const secs=Math.round(+d.seconds); if(!isFinite(secs)||secs<10||clearBusy) return;
    let det={}; try{ det=(d.details&&typeof d.details==="object")? JSON.parse(JSON.stringify(d.details)) : {}; }catch(e){}
    if(Array.isArray(det.battles)) det.battles=det.battles.slice(0,24).map(b=>({id:String(b.id||"").slice(0,30),rank:String(b.rank||"").slice(0,3),score:Math.max(0,Math.min(100,Math.round(+b.score||0)))}));
    if(JSON.stringify(det).length>3500) det={};
    const ver=String(d.ver||GJ.CLEAR_VER[L]||"v1").toLowerCase().replace(/[^a-z0-9._-]/g,"").slice(0,20)||"v1", mode=String(d.mode||"").toLowerCase().replace(/[^a-z0-9 _-]/g,"").slice(0,20);
    clearBusy=true; GJ.report(L,"finish",1);
    const send=()=>GJ.reportClear(L,ver,mode,secs,det).then(()=>{}).catch(()=>{});
    const esc=GJ.esc, t=esc(GJ.gname(L));
    const done=()=>{ send(); GJ.showSheet(`<div class="tour"><div class="tour-ic" aria-hidden="true">🏅</div><h2 class="gj-h">Champion!<small>${t} · ⏱ ${esc(GJ.fmtClock(secs))}</small></h2><p class="tour-d">Το τρέξιμό σου γράφτηκε στη λίστα των champions.</p>
      <button class="gj-go" id="chView" type="button">Δες τη λίστα</button><button class="gj-go tour-skip" id="chClose" type="button">Συνέχεια</button></div>`);
      const sh=GJ.sheetEl(); sh.querySelector("#chView").onclick=()=>GJ.championsSheet(L); sh.querySelector("#chClose").onclick=()=>GJ.close(); clearBusy=false; };
    if(GJ.voter().name){ done(); return; }
    GJ.showSheet(`<div class="tour"><div class="tour-ic" aria-hidden="true">🏅</div><h2 class="gj-h">Το τελείωσες!<small>${t} · ⏱ ${esc(GJ.fmtClock(secs))}</small></h2><p class="tour-d">Πώς σε λένε; Θα μπεις στη λίστα των champions.</p>
      <div class="clr-ask"><input id="chName" class="gj-in" maxlength="40" autocomplete="name" placeholder="Το όνομά σου"><button class="gj-go" id="chSave" type="button">Καταχώρηση</button><button class="gj-go tour-skip" id="chSkip" type="button">Όχι τώρα</button></div></div>`);
    const sh=GJ.sheetEl(); const inp=sh.querySelector("#chName"); setTimeout(()=>inp&&inp.focus(),250);
    sh.querySelector("#chSave").onclick=()=>{ const n=inp.value.trim(); if(!n){ inp.focus(); return; } GJ.setName(n); done(); };
    sh.querySelector("#chSkip").onclick=()=>{ clearBusy=false; GJ.close(); };
  }

  addEventListener("message",e=>{
    const d=e.data; if(!d||typeof d!=="object"||!d.gj) return;
    if(e.source!==frame.contentWindow) return;
    if(d.gj==="finish") GJ.report(L,"finish",1);
    else if(d.gj==="clear") handleClear(d);
    else if(d.gj==="progress"&&isFinite(d.value)) GJ.report(L,"progress",Math.max(0,Math.min(1,+d.value)));
  });

  /* menu */
  const fiFull=document.getElementById("fiFull"); if(canFull) fiFull.hidden=false;
  const setOpen=o=>{ fiFull.hidden = !(canFull && !document.fullscreenElement); fab.classList.toggle("open",o); fabBtn.setAttribute("aria-expanded",o); };
  fiFull.onclick=()=>{ goFull(); setOpen(false); };
  document.getElementById("fiVote").onclick=()=>{ setOpen(false); GJ.scoreSheet(L); };
  document.getElementById("fiCom").onclick=()=>{ setOpen(false); GJ.commentsSheet(L); };
  // drag GJ button vertically along the right edge; tap toggles menu
  let sy=0, st=0, moved=false, dragging=false;
  const savedTop=localStorage.getItem("gj_fab_top"); if(savedTop) fab.style.top=savedTop;
  fabBtn.addEventListener("pointerdown",e=>{ dragging=true; moved=false; sy=e.clientY; st=fab.getBoundingClientRect().top; fabBtn.setPointerCapture(e.pointerId); });
  fabBtn.addEventListener("pointermove",e=>{ if(!dragging) return; const dy=e.clientY-sy; if(Math.abs(dy)>6) moved=true;
    if(moved){ const t=Math.min(innerHeight-60,Math.max(4,st+dy)); fab.style.top=t+"px"; } });
  fabBtn.addEventListener("pointerup",()=>{ dragging=false; if(moved){ try{ localStorage.setItem("gj_fab_top",fab.style.top); }catch(e){} } else setOpen(!fab.classList.contains("open")); });

  /* gate particles (same pixel style as the hub, static-light) */
  const cv=document.getElementById("fx"), ctx=cv.getContext("2d"); let raf=0;
  const PAL={K:"#22223B",Y:"#FFC933",y:"#E0951F",W:"#FFFFFF",R:"#EE4266",r:"#B22A4A",T:"#1FA88A",t:"#127A63",B:"#3B82F6",b:"#1E4FB8"};
  const SPR=[["..KKKK..",".KYYYYK.","KYWYYyYK","KYWYYyYK","KYYYYyYK",".KYyyyK.","..KKKK.."],
    [".KK...KK.","KRRK.KRRK","KRWRKRRrK","KRRRRRRrK",".KRRRRrK.","..KRRrK..","...KrK..."],
    ["..KKKKK..",".KWTTTtK.","KWTTTTTtK","KKKKKKKKK",".KTTTTtK.","..KTTtK..","...KtK..."],
    ["..KKK..","..KWK..",".KKKKK.","KWBBBBK","KBBWBBK","KBBBBbK",".KbbbK."]];
  const imgs=SPR.map(r=>{const c=document.createElement("canvas");c.width=Math.max(...r.map(x=>x.length));c.height=r.length;const x=c.getContext("2d");
    r.forEach((row,j)=>[...row].forEach((ch,i)=>{if(PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1);}}));return c;});
  let W,H,parts=[];
  function rs(){ W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
    parts=Array.from({length:22},()=>({im:imgs[Math.random()*imgs.length|0],x:Math.random()*W,y:Math.random()*H,s:3+(Math.random()*3|0),v:12+Math.random()*24})); }
  rs(); addEventListener("resize",rs);
  const still=!matchMedia("(prefers-reduced-motion: no-preference)").matches; let last=performance.now();
  function fr(t){ const dt=Math.min(.05,(t-last)/1000); last=t; ctx.clearRect(0,0,W,H);
    for(const p of parts){ if(!still) p.y-=p.v*dt; if(p.y<-40){p.y=H+20;p.x=Math.random()*W;} ctx.globalAlpha=.6; ctx.drawImage(p.im,Math.round(p.x),Math.round(p.y),p.im.width*p.s,p.im.height*p.s); }
    raf=requestAnimationFrame(fr); }
  raf=requestAnimationFrame(fr);
  function stopFx(){ cancelAnimationFrame(raf); }
})();
</script>
</body>
</html>
