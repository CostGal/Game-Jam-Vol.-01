<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0c20">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Patra's Brawlers</title>
<style>
:root{
  --ink:#0f0c20; --cab:#1d1838; --mag:#ff4d8d; --gold:#ffcc33; --cyan:#4fe3ff; --bone:#f4ecd6;
  color-scheme:dark;
}
html,body{margin:0; height:100dvh; overflow:hidden; touch-action:manipulation; overscroll-behavior:none; -webkit-text-size-adjust:100%}
html{background:var(--ink)}
body{
  margin:0; background:var(--ink); color:var(--bone);
  font-family:ui-monospace, Menlo, Consolas, monospace;
  box-sizing:border-box; padding:env(safe-area-inset-top,0px) max(16px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px, env(safe-area-inset-left,0px)); -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
#cab{position:relative; line-height:0; box-shadow:0 0 0 3px var(--cab), 0 0 0 5px #000, 0 18px 50px rgba(0,0,0,.6)}
#screen{image-rendering:pixelated; image-rendering:crisp-edges; display:block; background:#000}
#crt{position:absolute; inset:0; pointer-events:none; display:none;
  background:
    radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%),
    repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, rgba(0,0,0,0) 1px 3px);
  mix-blend-mode:multiply}
body.crt #crt{display:block}
body.crt #screen{filter:saturate(1.15) contrast(1.05)}
#pad{display:none; width:100%; max-width:760px; justify-content:space-between; align-items:center; gap:10px;
  padding-bottom:env(safe-area-inset-bottom,0px); touch-action:none}
body.touch #pad{display:flex}
.side{display:flex; align-items:center; gap:12px; touch-action:none}
#pad2{display:none}
body.two #pad2{display:flex}
.dpad{width:var(--dp,132px); height:var(--dp,132px); border-radius:50%; background:var(--cab); border:3px solid #000; position:relative; flex:none; touch-action:none}
.dpad::before,.dpad::after{content:""; position:absolute; background:#2e2757; border-radius:4px}
.dpad::before{left:50%; top:11%; bottom:11%; width:28%; transform:translateX(-50%)}
.dpad::after{top:50%; left:11%; right:11%; height:28%; transform:translateY(-50%)}
.btns{display:grid; grid-template-columns:repeat(3,var(--bt,54px)); gap:calc(var(--bt,54px) * .14); touch-action:none}
.btns button{width:var(--bt,54px); height:var(--bt,54px); border-radius:50%; border:3px solid #000; font:inherit; font-size:calc(var(--bt,54px) * .19); color:#120d1f; touch-action:none; padding:0}
.btns button.on{filter:brightness(1.4); transform:scale(.94)}
.bp{background:#ff4d6d}.bk{background:#ffcc33}.bb{background:#4fe3ff}.bs{background:#c77dff}.bt{background:#9be564}.bx{background:#8c86a8}
.p2 .btns button{border-color:#123a5e}
/* landscape phones and tablets: controls float over the screen corners */
body.touch.land #pad{position:fixed; inset:0; max-width:none; padding:0; pointer-events:none; opacity:.62; display:block}
body.touch.land .side > *{pointer-events:auto}
body.touch.land #pad1 .dpad{position:fixed; left:calc(env(safe-area-inset-left,0px) + 12px); bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
body.touch.land #pad1 .btns{position:fixed; right:calc(env(safe-area-inset-right,0px) + 12px); bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
body.touch.land.two #pad1 .btns{right:auto; left:calc(env(safe-area-inset-left,0px) + 12px); bottom:calc(env(safe-area-inset-bottom,0px) + 22px + var(--dp,132px))}
body.touch.land.two #pad2 .dpad{position:fixed; right:calc(env(safe-area-inset-right,0px) + 12px); bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
body.touch.land.two #pad2 .btns{position:fixed; right:calc(env(safe-area-inset-right,0px) + 12px); bottom:calc(env(safe-area-inset-bottom,0px) + 22px + var(--dp,132px))}
body.touch.two:not(.land) #pad2{display:none}
#rotate{display:none; font-size:15px; color:var(--gold); text-align:center; padding:6px 0}
body.touch.land .btns{grid-template-columns:repeat(2,var(--bt,54px))}
body.touch.two:not(.land) #rotate{display:block}
#savebox{display:none; position:fixed; inset:0; z-index:20; align-items:center; justify-content:center; padding:16px; background:rgba(15,12,32,.72)}
#savebox.on{display:flex}
.sb-panel{width:min(520px,100%); max-height:100%; overflow:auto; background:var(--cab); border:3px solid #000; box-shadow:0 0 0 2px #2e2757; padding:14px; color:var(--bone); font:inherit; font-size:12px}
.sb-panel h2{margin:0 0 6px; color:var(--gold); font-size:16px; font-weight:normal}
.sb-note{margin:0 0 10px; color:#b9b3d6; line-height:1.4; font-family:system-ui,sans-serif; font-size:13px}
.sb-panel label{display:block; margin:12px 0 4px; color:var(--cyan)}
.sb-panel textarea{width:100%; box-sizing:border-box; background:#0f0c20; color:var(--bone); border:2px solid #000; padding:6px; font:12px/1.35 ui-monospace,monospace; resize:vertical; word-break:break-all}
.sb-row{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
.sb-panel button{font:inherit; font-size:12px; background:var(--mag); color:#120d1f; border:2px solid #000; padding:8px 12px; cursor:pointer; min-height:40px}
.sb-panel button#sb-back{background:#8c86a8}
.sb-panel button:focus-visible,.sb-panel textarea:focus-visible{outline:2px solid var(--gold)}
#sb-msg{min-height:1.2em; margin:10px 0 0}
@media (prefers-reduced-motion: reduce){ #btns button.on{transform:none} }
</style>
</head>
<body>

<div id="cab"><canvas id="screen" width="640" height="360" aria-label="Patra's Brawlers game screen"></canvas><div id="crt"></div></div>
<div id="rotate">Turn the phone sideways for 2 players</div>
<div id="pad">
  <div class="side p1" id="pad1">
    <div class="dpad" data-p="1" aria-label="Player 1 direction pad"></div>
    <div class="btns" data-p="1">
      <button class="bp" data-k="p">Punch</button><button class="bk" data-k="k">Kick</button><button class="bb" data-k="b">Block</button>
      <button class="bs" data-k="s">Special</button><button class="bt" data-k="t">Taunt</button><button class="bx" data-k="pause">Pause</button>
    </div>
  </div>
  <div class="side p2" id="pad2">
    <div class="btns" data-p="2">
      <button class="bp" data-k="p">P2 Punch</button><button class="bk" data-k="k">P2 Kick</button><button class="bb" data-k="b">P2 Block</button>
      <button class="bs" data-k="s">P2 Spec</button><button class="bt" data-k="t">P2 Taunt</button><button class="bx" data-k="pause">Pause</button>
    </div>
    <div class="dpad" data-p="2" aria-label="Player 2 direction pad"></div>
  </div>
</div>
<script>
const ONLINE = false;
'use strict';
// ================= CORE =================
const W = 320, H = 180, FLOOR = 160;
const GAME_VERSION = '4.5.0'; // MAJOR.MEDIUM.SMALL - see CHANGELOG.md
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const shadeCache = new Map();
function shade(hex, f) {
  const key = hex + f; if (shadeCache.has(key)) return shadeCache.get(key);
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f <= 1) { r *= f; g *= f; b *= f; } else { const k = f - 1; r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  const out = '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
  shadeCache.set(key, out); return out;
}
// hue-shifted ramp (DS-era handheld style): shadows lean cool/violet, highlights lean warm, never muddy grey
function rgb2hsl(r, g, b) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2; let h = 0, s = 0;
  if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; } return [h, s, l]; }
function hsl2rgb(h, s, l) { if (!s) return [l * 255, l * 255, l * 255]; const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; }; return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255]; }
function mixHex(a, b, t) { const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16), m = (s) => Math.round(((x >> s) & 255) * (1 - t) + ((y >> s) & 255) * t);
  return '#' + [m(16), m(8), m(0)].map(v => v.toString(16).padStart(2, '0')).join(''); }
const hsCache = new Map();
function hs(hex, f) {
  const key = hex + f; if (hsCache.has(key)) return hsCache.get(key);
  const out = f < 1 ? mixHex(shade(hex, f), '#6a2e6e', (1 - f) * .3) : f > 1 ? mixHex(shade(hex, f), '#fff0c4', (f - 1) * .35) : hex;
  hsCache.set(key, out); return out;
}
// line colour for a part: a deep, saturated version of its own colour (coloured outlines, not flat black)
const lineCache = new Map();
function lineOf(hex, inner) { const k = hex + (inner ? 'i' : ''); if (!lineCache.has(k)) lineCache.set(k, inner ? mixHex(hs(hex, .55), '#2a1e3a', .35) : mixHex(hs(hex, .3), '#100c18', .72)); return lineCache.get(k); }

const SAVE_KEYS = ['patras.unlocks.v1', 'patras.records.v1', 'patras.options.v1'];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { }
    if (SAVE_KEYS.includes(k)) { try { localStorage.setItem('patras.savedAt.v1', String(Date.now())); } catch (e) { } try { cloudQueue(); } catch (e) { /* online save not set up yet (early in load) */ } } }
};

// Options (all changeable in-game)
const OPT_DEFAULT = { music: true, sfx: true, crt: true, timer: 99, margin: 2, sudden: 11, items: 'ON', friendItems: true, weather: true, daynight: true, touch: 'AUTO', padSwap: false };
const OPT = Object.assign({}, OPT_DEFAULT, store.get('patras.options.v1', {}));
if (OPT.items !== 'OFF') OPT.items = 'ON';
if (!OPT.hpLayersV) { if (OPT.timer === 60) OPT.timer = 99; OPT.hpLayersV = 1; } // longer rounds now that health comes in 3 layers
if (!OPT.marginV2) { OPT.margin = 2; OPT.marginV2 = 1; store.set('patras.options.v1', OPT); } // one-time: everyone back on WIN BY 2 (1 and 3 stay selectable)
const BUFF_FRAMES = 420; // percentage buffs last 7 seconds
const ITEMS_PER_ROUND = 5;
function saveOpt() { store.set('patras.options.v1', OPT); applyOpt(); }
function applyOpt() {
  document.body.classList.toggle('crt', !!OPT.crt);
  if (typeof musicApply === 'function') musicApply();
  if (typeof fit === 'function') fit();
}

// Drawing helpers
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function dither(g, x, y, w, h, c, off = 0) { g.fillStyle = c; for (let j = 0; j < h; j++) for (let i = ((j + off) & 1); i < w; i += 2) g.fillRect(x + i, y + j, 1, 1); }
function circ(g, cx, cy, r, c) { g.fillStyle = c; for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); g.fillRect(cx - w, cy + dy, w * 2 + 1, 1); } }
function bands(g, cols, y0, y1) {
  const n = cols.length, bh = (y1 - y0) / n;
  for (let i = 0; i < n; i++) {
    const a = Math.round(y0 + i * bh), b = Math.round(y0 + (i + 1) * bh);
    R(g, 0, a, W, b - a, cols[i]);
    if (i < n - 1) { dither(g, 0, b - 2, W, 2, cols[i + 1]); }
    if (i > 0) { dither(g, 0, a, W, 1, cols[i - 1], 1); }
  }
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }

// ================= BITMAP FONT (5x7) =================
const GL = {
  A: '01110 10001 10001 11111 10001 10001 10001', B: '11110 10001 10001 11110 10001 10001 11110',
  C: '01110 10001 10000 10000 10000 10001 01110', D: '11110 10001 10001 10001 10001 10001 11110',
  E: '11111 10000 10000 11110 10000 10000 11111', F: '11111 10000 10000 11110 10000 10000 10000',
  G: '01110 10001 10000 10111 10001 10001 01111', H: '10001 10001 10001 11111 10001 10001 10001',
  I: '01110 00100 00100 00100 00100 00100 01110', J: '00111 00010 00010 00010 00010 10010 01100',
  K: '10001 10010 10100 11000 10100 10010 10001', L: '10000 10000 10000 10000 10000 10000 11111',
  M: '10001 11011 10101 10101 10001 10001 10001', N: '10001 10001 11001 10101 10011 10001 10001',
  O: '01110 10001 10001 10001 10001 10001 01110', P: '11110 10001 10001 11110 10000 10000 10000',
  Q: '01110 10001 10001 10001 10101 10010 01101', R: '11110 10001 10001 11110 10100 10010 10001',
  S: '01111 10000 10000 01110 00001 00001 11110', T: '11111 00100 00100 00100 00100 00100 00100',
  U: '10001 10001 10001 10001 10001 10001 01110', V: '10001 10001 10001 10001 10001 01010 00100',
  W: '10001 10001 10001 10101 10101 10101 01010', X: '10001 10001 01010 00100 01010 10001 10001',
  Y: '10001 10001 10001 01010 00100 00100 00100', Z: '11111 00001 00010 00100 01000 10000 11111',
  0: '01110 10001 10011 10101 11001 10001 01110', 1: '00100 01100 00100 00100 00100 00100 01110',
  2: '01110 10001 00001 00010 00100 01000 11111', 3: '11111 00010 00100 00010 00001 10001 01110',
  4: '00010 00110 01010 10010 11111 00010 00010', 5: '11111 10000 11110 00001 00001 10001 01110',
  6: '00110 01000 10000 11110 10001 10001 01110', 7: '11111 00001 00010 00100 01000 01000 01000',
  8: '01110 10001 10001 01110 10001 10001 01110', 9: '01110 10001 10001 01111 00001 00010 01100',
  ' ': '00000 00000 00000 00000 00000 00000 00000', '.': '00000 00000 00000 00000 00000 01100 01100',
  ',': '00000 00000 00000 00000 01100 00100 01000', '!': '00100 00100 00100 00100 00100 00000 00100',
  '?': '01110 10001 00001 00010 00100 00000 00100', ':': '00000 01100 01100 00000 01100 01100 00000',
  '-': '00000 00000 00000 11111 00000 00000 00000', '+': '00000 00100 00100 11111 00100 00100 00000',
  "'": '00100 00100 01000 00000 00000 00000 00000', '"': '01010 01010 00000 00000 00000 00000 00000',
  '/': '00001 00010 00010 00100 01000 01000 10000', '(': '00010 00100 01000 01000 01000 00100 00010',
  ')': '01000 00100 00010 00010 00010 00100 01000', '%': '11001 11010 00010 00100 01000 01011 10011',
  '>': '01000 00100 00010 00001 00010 00100 01000', '<': '00010 00100 01000 10000 01000 00100 00010',
  '=': '00000 00000 11111 00000 11111 00000 00000', '*': '00000 10101 01110 11111 01110 10101 00000',
  '#': '01010 01010 11111 01010 11111 01010 01010', '&': '01100 10010 10100 01000 10101 10010 01101',
  ';': '00000 01100 01100 00000 01100 00100 01000', '_': '00000 00000 00000 00000 00000 00000 11111', '^': '00100 01110 10101 00100 00100 00100 00100',
  '~': '00100 00100 00100 00100 10101 01110 00100', '{': '00000 00100 01000 11111 01000 00100 00000',
  '}': '00000 00100 00010 11111 00010 00100 00000', '@': '01110 10001 10111 10101 10111 10000 01111',
};
// ^ up arrow, ~ down arrow, { left arrow, } right arrow
const GLB = {}; for (const k in GL) GLB[k] = GL[k].replace(/ /g, '');
const textCache = new Map();
function textCanvas(str, color, s, sh) {
  const key = str + '|' + color + '|' + s + '|' + sh;
  let c = textCache.get(key); if (c) return c;
  if (textCache.size > 800) textCache.clear();
  const w = Math.max(1, str.length * 6 * s) + s, h = 8 * s;
  const [cc, g] = mk(w, h);
  const pass = (col, ox, oy) => {
    g.fillStyle = col;
    for (let i = 0; i < str.length; i++) {
      const gl = GLB[str[i]] || GLB['?'];
      for (let p = 0; p < 35; p++) if (gl[p] === '1') g.fillRect(i * 6 * s + (p % 5) * s + ox, Math.floor(p / 5) * s + oy, s, s);
    }
  };
  if (sh) pass(sh, s > 1 ? Math.ceil(s / 2) : 1, s > 1 ? Math.ceil(s / 2) : 1);
  pass(color, 0, 0);
  textCache.set(key, cc); return cc;
}
function textW(str, s = 1) { return String(str).length * 6 * s - s; }
function text(g, str, x, y, color = '#f4ecd6', s = 1, align = 'l', sh = '#120d1f') {
  str = String(str).toUpperCase();
  const c = textCanvas(str, color, s, sh);
  const w = textW(str, s);
  const dx = align === 'c' ? x - w / 2 : align === 'r' ? x - w : x;
  g.drawImage(c, Math.round(dx), Math.round(y));
}
// wrap text to width (chars)
function wrap(str, n) {
  const words = String(str).split(' '); const lines = []; let cur = '';
  for (const w of words) { if ((cur + ' ' + w).trim().length > n) { if (cur) lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }
  if (cur) lines.push(cur); return lines;
}
// Chunky panel
function panel(g, x, y, w, h, fill = '#1d1838', edge = '#000', hi = '#2e2757') {
  R(g, x, y, w, h, edge); R(g, x + 1, y + 1, w - 2, h - 2, fill); R(g, x + 1, y + 1, w - 2, 1, hi);
}

// ================= AUDIO (all generated) =================
const AU = { ctx: null, master: null, music: null, sfx: null, noise: null, waves: {} };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const a = AU.ctx = new A();
    AU.master = a.createGain(); AU.master.gain.value = 0.8; AU.master.connect(a.destination);
    AU.music = a.createGain(); AU.music.gain.value = 0.16; AU.music.connect(AU.master);
    AU.sfx = a.createGain(); AU.sfx.gain.value = 0.42; AU.sfx.connect(AU.master);
    const len = a.sampleRate * 1; const buf = a.createBuffer(1, len, a.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = buf;
    for (const [name, duty] of [['p12', .125], ['p25', .25], ['p50', .5]]) {
      const n = 40, re = new Float32Array(n), im = new Float32Array(n);
      for (let k = 1; k < n; k++) re[k] = 2 * Math.sin(k * Math.PI * duty) / (k * Math.PI);
      AU.waves[name] = a.createPeriodicWave(re, im);
    }
    if (MUS.pending) { const p = MUS.pending; MUS.pending = null; playSong(p); }
  } catch (e) { AU.ctx = null; }
}
function tone(f, d, o = {}) {
  const a = AU.ctx; if (!a) return;
  const t = o.t ?? a.currentTime;
  const osc = a.createOscillator();
  if (o.w && AU.waves[o.w]) osc.setPeriodicWave(AU.waves[o.w]); else osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + d);
  const g = a.createGain(); const v = o.v ?? .3;
  if (o.sus) { g.gain.setValueAtTime(v, t); g.gain.setValueAtTime(v, t + d * .75); g.gain.linearRampToValueAtTime(0.0001, t + d); }
  else { g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d); }
  osc.connect(g); g.connect(o.dest || AU.sfx); osc.start(t); osc.stop(t + d + .03);
}
function noise(d, o = {}) {
  const a = AU.ctx; if (!a || !AU.noise) return;
  const t = o.t ?? a.currentTime;
  const s = a.createBufferSource(); s.buffer = AU.noise;
  let node = s;
  if (o.lp || o.hp) { const fl = a.createBiquadFilter(); fl.type = o.lp ? 'lowpass' : 'highpass'; fl.frequency.value = o.lp || o.hp; s.connect(fl); node = fl; }
  const g = a.createGain(); g.gain.setValueAtTime(o.v ?? .3, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  node.connect(g); g.connect(o.dest || AU.sfx); s.start(t, Math.random() * .5); s.stop(t + d + .02);
}

function compileSong(def) {

    if (def.drums) for (let s = 0; s < 16; s++) {
      if (s === 0 || s === 8 || (def.drums > 1 && s === 10 && b % 2)) ev[base + s].push({ ch: 'kick' });

const MUS = { name: null, song: null, step: 0, next: 0, timer: null, pending: null, cache: {} };

  if (!AU.ctx) { MUS.pending = name; return; }
  MUS.song = MUS.cache[name] || (MUS.cache[name] = compileSong(SONG_DEFS[name] || SONG_DEFS.title));

  for (const p of pads) {

(function setupTouch() {

    const th = touchHeld[dp.dataset.p]; const dirs = new Map();
    const upd = () => { th.l = th.r = th.u = th.d = false; for (const v of dirs.values()) for (const k in v) if (v[k]) th[k] = true; };
    const calc = e => {

// ---------- CHARACTER SELECT ----------
let GRID_COLS = 3, TILE = 48, GAP = 4;
function gridSize() { const n = roster().length; GRID_COLS = n <= 6 ? 3 : n <= 12 ? 4 : 5; TILE = n <= 6 ? 48 : n <= 12 ? 40 : 32; GAP = n <= 6 ? 4 : 3; }
function gridPos(i) {
  const n = roster().length; const rows = Math.ceil(n / GRID_COLS);
  const gw = GRID_COLS * TILE + (GRID_COLS - 1) * GAP; const x0 = Math.round(160 - gw / 2), y0 = n <= 6 ? 26 : 18;
  if (i === n) return [160 - 30, y0 + rows * (TILE + GAP) + 2, 60, 12];
  return [x0 + (i % GRID_COLS) * (TILE + GAP), y0 + Math.floor(i / GRID_COLS) * (TILE + GAP), TILE, TILE];
}
function gridMove(i, c) {
  const n = roster().length; const rows = Math.ceil(n / GRID_COLS);
  if (i === n) { if (c.pr.u) return (rows - 1) * GRID_COLS + 1; return i; }
  const col = i % GRID_COLS, row = Math.floor(i / GRID_COLS);
  if (c.pr.l) return row * GRID_COLS + (col + GRID_COLS - 1) % GRID_COLS;
  if (c.pr.r) return Math.min(n - 1, row * GRID_COLS + (col + 1) % GRID_COLS);
  if (c.pr.u) return row > 0 ? i - GRID_COLS : i;
  if (c.pr.d) return row < rows - 1 ? Math.min(n - 1, i + GRID_COLS) : n;
  return i;
}
const LEVELS = ['EASY', 'NORMAL', 'HARD'];
SC.select = {
  enter(arg) {
    this.mode = arg.mode; setSolo(this.mode !== 'vs');
    gridSize(); this.cur = [0, 1]; this.lock = [null, null]; this.step = 0; this.level = 1; this.t = 0;
    playSong('select');
  },
  resolve(i) { return i === roster().length ? pick(roster()).id : roster()[i].id; },
  update() {
    this.t++;
    const n = roster().length;
    if (tap) {
      let hit = -1; for (let i = 0; i <= n; i++) { const [x, y, w, h] = gridPos(i); if (inBox(tap, x, y, w, h)) hit = i; }
      if (this.mode !== 'vs' && this.step === 2) { if (tap.x < 110) { this.level = (this.level + 2) % 3; sfx('move'); } else if (tap.x > 210) { this.level = (this.level + 1) % 3; sfx('move'); } else if (tap.y > 135) { sfx('ok'); this.done(); } return; }
      if (hit >= 0) {
        const p = this.mode === 'vs' ? (this.lock[0] == null ? 0 : this.lock[1] == null ? 1 : -1) : this.step;
        if (p >= 0 && p < 2) {
          if (this.cur[p] === hit) { this.lock[p] = this.resolve(hit); sfx('ok'); if (this.mode !== 'vs') { this.step++; if (this.mode === 'tourney') return startTourney(this.lock[0]); if (this.step === 2 && this.mode === 'training') this.done(); } }
          else { this.cur[p] = hit; sfx('move'); }
        }
        return;
      }
    }
    if (this.mode === 'vs') {
      for (const p of [0, 1]) {
        const c = ctl[p + 1];
        if (this.lock[p] == null) {
          const ni = gridMove(this.cur[p], c); if (ni !== this.cur[p]) { this.cur[p] = ni; sfx('move'); }
          if (c.pr.ok || c.pr.p) { this.lock[p] = this.resolve(this.cur[p]); sfx('ok'); }
          else if (c.pr.back && p === 0 && this.lock[1] == null) { sfx('back'); go('menu'); return; }
        } else if (c.pr.back || c.pr.k) { this.lock[p] = null; sfx('back'); }
      }
      if (this.lock[0] && this.lock[1]) { this.t2 = (this.t2 || 0) + 1; if (this.t2 > 30) { this.t2 = 0; go('country', { mode: 'vs', p1: this.lock[0], p2: this.lock[1] }); } } else this.t2 = 0;
      return;
    }
    const c = ctl[1];
    if (this.step < 2) {
      const p = this.step; const ni = gridMove(this.cur[p], c); if (ni !== this.cur[p]) { this.cur[p] = ni; sfx('move'); }
      if (c.pr.ok || c.pr.p) { this.lock[p] = this.resolve(this.cur[p]); sfx('ok'); this.step++; if (this.mode === 'tourney') return startTourney(this.lock[0]); if (this.step === 2 && this.mode === 'training') this.done(); }
      else if (c.pr.back || c.pr.k) { sfx('back'); if (this.step === 0) go('menu'); else { this.step--; this.lock[this.step] = null; } }
    } else {
      if (c.pr.l) { this.level = (this.level + 2) % 3; sfx('move'); }
      if (c.pr.r) { this.level = (this.level + 1) % 3; sfx('move'); }
      if (c.pr.ok || c.pr.p) { sfx('ok'); this.done(); }
      else if (c.pr.back || c.pr.k) { sfx('back'); this.step = 1; this.lock[1] = null; }
    }
  },
  done() { go('country', { mode: this.mode, p1: this.lock[0], p2: this.lock[1], level: LEVELS[this.level] }); },
  draw() {
    R(ctx, 0, 0, W, H, INK);
    for (let y = 0; y < H; y += 4) R(ctx, 0, y, W, 1, '#141030');
    const titles = { vs: 'CHOOSE YOUR FIGHTERS', cpu: this.step === 0 ? 'CHOOSE YOUR FIGHTER' : this.step === 1 ? 'CHOOSE YOUR OPPONENT' : 'CPU DIFFICULTY', training: this.step === 0 ? 'CHOOSE YOUR FIGHTER' : 'CHOOSE A DUMMY' };
    text(ctx, titles[this.mode], 160, 8, GOLD, 1, 'c');
    const n = roster().length;
    for (let i = 0; i < n; i++) { const [x, y] = gridPos(i); R(ctx, x - 1, y - 1, TILE + 2, TILE + 2, '#000'); drawPortrait(ctx, roster()[i], x, y, TILE, '#231d45'); if (TILE >= 48) { R(ctx, x, y + TILE - 9, TILE, 9, 'rgba(0,0,0,.65)'); const nm = roster()[i].name.split(':')[0], tw2 = textW(nm, 1); if (tw2 > TILE - 2) { ctx.save(); ctx.translate(x + TILE / 2, 0); ctx.scale((TILE - 2) / tw2, 1); text(ctx, nm, 0, y + TILE - 8, BONE, 1, 'c', null); ctx.restore(); } else text(ctx, nm, x + TILE / 2, y + TILE - 8, BONE, 1, 'c', null); } }
    { const [x, y, w, h] = gridPos(n); R(ctx, x, y, w, h, '#000'); R(ctx, x + 1, y + 1, w - 2, h - 2, '#231d45'); text(ctx, 'RANDOM', x + w / 2, y + 3, MUTED, 1, 'c', null); }
    // cursors
    const curs = this.mode === 'vs' ? [0, 1] : [Math.min(this.step, 1)];
    for (const p of (this.mode === 'vs' ? [0, 1] : [0, 1].filter(p => p <= this.step && p < 2))) {
      const [x, y, w, h] = gridPos(this.cur[p]); const col = p ? P2C : P1C;
      const locked = this.lock[p] != null; const blink = locked || ((gt >> 3) & 1);
      if (blink) { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.strokeRect(x - 2 + p, y - 2 + p, w + 4 - p * 2, h + 4 - p * 2); }
      text(ctx, this.mode !== 'vs' && p === 1 ? (this.mode === 'training' ? 'DUM' : 'CPU') : 'P' + (p + 1), x + (p ? w - 1 : 1), y + 1, col, 1, p ? 'r' : 'l', '#000');
    }
    // side previews
    for (const p of [0, 1]) {
      const shown = this.mode === 'vs' || p <= this.step;
      if (!shown) continue;
      const id = this.lock[p] || (this.cur[p] === n ? null : roster()[this.cur[p]].id);
      const cx = p ? 282 : 38, col = p ? P2C : P1C;
      if (!id) { text(ctx, '?', cx, 80, MUTED, 4, 'c'); continue; }

      ctx.restore();

      const bar = (label, v, y) => { text(ctx, label, cx - 34, y, MUTED, 1, 'l', null); R(ctx, cx - 12, y + 1, 46, 5, '#000'); R(ctx, cx - 11, y + 2, Math.round(44 * v), 3, col); };
      bar('POW', (d.stats.pow - .8) / .4, 128); bar('SPD', (d.stats.spd - .8) / .5, 135); bar('HP', (d.stats.hp - 85) / 30, 142);
      wrap(d.special.name, 12).slice(0, 2).forEach((ln, k) => text(ctx, ln, cx, 152 + k * 8, GOLD, 1, 'c'));
    }
    if (this.mode === 'cpu' && this.step === 2) { panel(ctx, 100, 142, 120, 22, '#2e2757'); text(ctx, '{ ' + LEVELS[this.level] + ' }', 160, 149, GOLD, 1, 'c'); }

  }

  draw() {

      text(ctx, this.slots[i], x + 12, 64, on ? GOLD : BONE, 2, 'c', null);

    }
    if (this.msgT > 0) text(ctx, this.msg, 160, 108, this.msgC, 1, 'c');
    const u = unlocked().length; text(ctx, u ? 'SECRET FIGHTERS UNLOCKED: ' + u : 'NO SECRET FIGHTERS UNLOCKED YET', 160, 128, BONE, 1, 'c');
    hint(touchOn() ? 'TAP A BOX TO TYPE   TAP HERE: BACK' : 'TYPE OR UP/DOWN   ENTER: TRY   ESC: BACK');
    if (touchOn()) { R(ctx, 120, 140, 80, 16, '#000'); R(ctx, 121, 141, 78, 14, '#2e2757'); text(ctx, 'TRY CODE', 160, 145, GOLD, 1, 'c'); }

};

// ---------- UNLOCK CUTSCENE + POPUP (plays when a code works) ----------
const UNLOCK_POP = 200; // frame the popup opens
SC.unlock = {
  enter(d) { this.d = d; this.t = 0; this.pt = 0; this.sp = {};
    const sin = !!d.base, rim = sin ? '#ff5a3a' : GOLD;
    for (const k of ['idle', 'win']) { // colour / rim / silhouette layers, built once
      const [c, cg] = mk(640, 360); cg.setTransform(2, 0, 0, 2, 0, 0); drawFighterSprite(cg, d, d.pal, 160, 150, 1, POSES[k], { expr: k === 'win' ? 'win' : null });
      const [r, rg] = mk(640, 360); rg.drawImage(c, 0, 0); rg.globalCompositeOperation = 'source-in'; rg.fillStyle = rim; rg.fillRect(0, 0, 640, 360);
      const [sl, sg] = mk(640, 360); sg.drawImage(c, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = '#0b0714'; sg.fillRect(0, 0, 640, 360);
      this.sp[k] = [c, r, sl]; }
  },
  update() {
    this.t++; const c = ctl.any, press = tap || c.pr.ok || c.pr.p || c.pr.k;
    if (this.t === 70) sfx('boom'); if (this.t === 140) sfx('win');
    if (this.t < UNLOCK_POP) { if (press && this.t > 20) { this.t = UNLOCK_POP; sfx('ok'); } return; }

    if (press && this.pt > 15) { sfx('ok'); go('code', this.d); }
  },
  cut(g) {
    const d = this.d, sin = !!d.base, t = Math.min(this.t, UNLOCK_POP);
    R(g, 0, 0, W, H, '#05030c');
    if (t < 70) { // beat 1: chained padlock shakes
      const sh = t > 20 ? Math.round(Math.sin(t * 1.7) * Math.min(3, (t - 20) / 12)) : 0;
      for (let i = -8; i <= 8; i++) { R(g, 160 + i * 10 + sh, 90 - i * 5, 7, 3, '#4a4458'); R(g, 160 + i * 10 + sh, 90 + i * 5, 7, 3, '#4a4458'); }
      const x = 160 + sh, y = 92;
      R(g, x - 9, y - 22, 3, 14, '#9a90b0'); R(g, x + 6, y - 22, 3, 14, '#9a90b0'); R(g, x - 9, y - 24, 18, 3, '#9a90b0');
      R(g, x - 14, y - 10, 28, 24, '#c8961e'); R(g, x - 14, y - 10, 28, 3, '#ffe070'); R(g, x - 14, y + 11, 28, 3, '#8a5a1a');

      text(g, sin ? 'SOMETHING STIRS...' : 'A NEW CHALLENGER...', 160, 150, t % 30 < 20 ? BONE : MUTED, 1, 'c', '#000');
    } else { // beat 2-3: lock bursts, silhouette, colour fades in, name slam
      const u = t - 70;
      g.save(); g.translate(160, 96);
      for (let i = 0; i < 16; i++) { const a = i / 16 * 6.283 + u * .01; g.fillStyle = i & 1 ? 'rgba(255,240,190,.10)' : (sin ? 'rgba(255,60,40,.16)' : 'rgba(255,204,51,.16)');
        g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * 260, Math.sin(a) * 260); g.lineTo(Math.cos(a + .2) * 260, Math.sin(a + .2) * 260); g.fill(); }
      g.restore();
      if (u < 40) for (let k = 0; k < 10; k++) { const a = k * .63, r = u * 4; R(g, 160 + Math.cos(a) * r, 92 + Math.sin(a) * r + u * u * .04, 4, 3, k & 1 ? '#c8961e' : '#9a90b0'); }
      const [c, r, sl] = this.sp[u < 60 ? 'idle' : 'win'], rev = Math.max(0, Math.min(1, (u - 50) / 40));
      g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(r, -3, -2); g.drawImage(r, 3, -2); g.drawImage(r, 0, -4); g.drawImage(sl, 0, 0); g.globalAlpha = rev; g.drawImage(c, 0, 0); g.restore();
      R(g, 120, 150, 80, 2, '#000');
      if (u < 8) { g.fillStyle = 'rgba(255,255,255,' + (1 - u / 8) + ')'; g.fillRect(0, 0, W, H); }
      R(g, 0, 0, W, 22, '#000'); R(g, 0, 158, W, 22, '#000');
      if (u > 70) { const sc = u < 76 ? 5 - Math.floor((u - 70) / 2) : 3; text(g, d.name, 160, 34 - sc * 2, sin ? '#ff5a3a' : GOLD, sc > 3 ? sc : (textW(d.name, 3) > 300 ? 2 : 3), 'c', sin ? '#3a0000' : '#7a1050'); }
      if (u > 90) text(g, '"' + d.taunt[0] + '"', 160, 164, BONE, 1, 'c', '#000');
    }
  },
  draw() {
    const g = ctx, d = this.d; this.cut(g);
    if (this.t < UNLOCK_POP) { if (this.t > 20) text(g, touchOn() ? 'TAP: SKIP' : 'ENTER: SKIP', 314, 172, '#4a4458', 1, 'r', null); return; }
    const sin = !!d.base, acc = sin ? '#ff3a3a' : GOLD, t = this.pt;
    g.fillStyle = 'rgba(5,3,15,.7)'; g.fillRect(0, 0, W, H);
    const k = Math.min(1, t / 10), ph = Math.round(118 * k), y = 90 - ph / 2;
    R(g, 48, y - 2, 224, ph + 4, '#000'); R(g, 49, y - 1, 222, ph + 2, acc); R(g, 51, y + 1, 218, ph - 2, '#1d1838');
    if (k < 1) return;
    R(g, 51, y + 1, 218, 16, sin ? '#5a0e14' : '#2e2757');
    text(g, sin ? 'SIN UNLOCKED!' : 'NEW FIGHTER UNLOCKED!', 160, y + 5, acc, 1, 'c', '#000');
    R(g, 60, y + 24, 58, 58, '#000'); drawPortrait(g, d, 61, y + 25, 56, sin ? '#3a0a10' : '#123a5e');
    const s2 = textW(d.name, 2) <= 142 ? 2 : 1;
    text(g, 'YOU UNLOCKED', 126, y + 26, MUTED, 1, 'l');
    text(g, d.name, 126, y + 38, BONE, s2, 'l', '#000');
    text(g, 'SPECIAL:', 126, y + (s2 === 2 ? 56 : 50), MUTED, 1, 'l');
    text(g, d.special.name, 126, y + (s2 === 2 ? 66 : 60), acc, 1, 'l');
    const n = SECRETS.findIndex(q => q.fighter.id === d.id) + 1; text(g, 'SECRET ' + n + ' OF ' + SECRETS.length, 126, y + (s2 === 2 ? 78 : 72), MUTED, 1, 'l');

    const on = (t >> 4) & 1; R(g, 136, y + 101, 48, 12, '#000'); R(g, 137, y + 102, 46, 10, on ? acc : '#2e2757'); text(g, 'OK', 160, y + 104, on ? '#000' : acc, 1, 'c', null);
  }

// ================= LOOP =================
let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  let steps = 0;
  while (acc >= 1000 / 60 && steps < 4) { tick(); acc -= 1000 / 60; steps++; }
  render();
  requestAnimationFrame(frame);
}
function tick() {
  gt++; pollInput();
  if (fade > 0 && fadeTo) { fade += 1; if (fade >= 10) { goNow(fadeTo.name, fadeTo.arg); fadeTo = null; fade = -10; } return; }
  if (fade < 0) fade++;
  scene.update();
  if (WARM.length) warmTick(3);
}
function render() {
  ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = false; // canvas is 2x: world in game pixels, fighters in sub-pixels
  scene.draw();
  const f = fade > 0 ? fade / 10 : fade < 0 ? -fade / 10 : 0;
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
}
function safeInsets() {
  let p = document.getElementById('sa-probe');
  if (!p) { p = document.createElement('div'); p.id = 'sa-probe'; p.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)'; document.body.appendChild(p); }
  const s = getComputedStyle(p); return { t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 };
}
function fit() {
  const SA = safeInsets(), touch = touchOn(), vw = innerWidth - SA.l - SA.r, vh = innerHeight - SA.t - SA.b, land = vw > vh, two = touch && !solo;
  const B = document.body; B.classList.toggle('touch', touch); B.classList.toggle('land', land); B.classList.toggle('two', two);
  B.classList.toggle('fsok', !!document.fullscreenEnabled);
  let dp, bt, padH = 0, sideW = 0;
  if (land) {
    dp = clamp(vh * .3, 84, 150); bt = clamp(vh * .115, 34, 58); if (two) { dp *= .8; bt *= .78; }
    sideW = Math.max(dp, bt * 2.15) + 22;
  } else {
    const gameH = (vw - 32) * 9 / 16, rest = vh - gameH - 40;
    const avail = vw - 46; dp = clamp(Math.min(avail * .42, rest * .5), 96, 190); bt = clamp(Math.min((avail - dp - 12) / 3.35, rest * .2), 38, 74);
    padH = Math.max(dp, bt * 2.3) + 24 + (two ? 30 : 0);
  }
  B.style.setProperty('--dp', Math.round(dp) + 'px'); B.style.setProperty('--bt', Math.round(bt) + 'px');
  let aw = vw - 32 - (touch ? 0 : 10), ah = vh - (touch ? padH + 12 : 30);
  if (touch && land && !two && (vw - 2 * sideW) / W >= 1.5) aw = vw - 2 * sideW; // keep the controls beside the screen
  let sc = Math.min(aw / W, ah / H); if (sc >= 2 && !touch) sc = Math.floor(sc); sc = Math.max(.8, sc);
  cv.style.width = Math.floor(W * sc) + 'px'; cv.style.height = Math.floor(H * sc) + 'px';
}
addEventListener('orientationchange', () => setTimeout(fit, 250));
addEventListener('resize', fit);

cv.addEventListener('pointerdown', () => { audioInit(); });
for (const ev of ['touchend', 'click', 'keydown']) addEventListener(ev, () => audioInit(), { passive: true });
document.addEventListener('visibilitychange', () => { if (!document.hidden && AU.ctx && AU.ctx.state !== 'running') AU.ctx.resume().catch(() => { }); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
function boot() { applyOpt(); fit(); goNow('title'); requestAnimationFrame(frame); }
window.__pf = { go: goNow, get scene() { return scene; }, get name() { return sceneName; }, OPT, tick, render, ctl };
boot();
